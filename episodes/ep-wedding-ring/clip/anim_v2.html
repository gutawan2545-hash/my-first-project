ref="#b2head_worry" display="none"/><use id="b9H2" href="#b2head_scared" display="none"/><g id="b9B" display="none"><ellipse cx="-13" cy="-1.6" rx="10" ry="7" fill="#fbe2cf"/><path d="M -22,-1.1 Q -13,2.4 -4,-1.1" fill="none" stroke="#1c1214" stroke-width="1.6" stroke-linecap="round"/><ellipse cx="13" cy="-1.6" rx="10" ry="7" fill="#fbe2cf"/><path d="M 22,-1.1 Q 13,2.4 4,-1.1" fill="none" stroke="#1c1214" stroke-width="1.6" stroke-linecap="round"/></g><g id="b9T" display="none"><path d="M -14,4 C -15,12 -13,20 -15,30" stroke="#cfe0ff" stroke-width="2" fill="none" opacity=".85"/><path d="M 14,4 C 15,12 13,20 15,30" stroke="#cfe0ff" stroke-width="2" fill="none" opacity=".85"/><circle cx="-15" cy="31" r="1.8" fill="#e6f0ff"/></g></g></g></g></g><rect id="s9rf" width="540" height="960" fill="#ffffff" opacity="0"/><rect id="s9rk" width="540" height="960" fill="#000" opacity="0"/></svg><svg viewBox="0 0 540 960"><g id="sub0" display="none"><text x="270" y="694" class="th">ถ้าวันนี้เป็นวัน</text><text x="270" y="720" class="th">แต่งงานของคุณ แต่</text><text x="270" y="744" class="en">If today were your wedding day, and just</text></g><g id="sub1" display="none"><text x="270" y="694" class="th">ในขณะที่คุณกำลังจะ</text><text x="270" y="720" class="th">สวมแหวนให้เจ้าบ่าว</text><text x="270" y="744" class="en">as you were about to put the ring</text></g><g id="sub2" display="none"><text x="270" y="685" class="th">จู่ ๆ ก็มีผู้หญิงคน</text><text x="270" y="712" class="th">หนึ่งเดินเข้ามากลางงาน</text><text x="270" y="735" class="en">on the groom, a woman suddenly walked into</text><text x="270" y="752" class="en">the middle</text></g><g id="sub3" display="none"><text x="270" y="694" class="th">แล้วบอกว่าเธอคือ</text><text x="270" y="720" class="th">ภรรยาของผู้ชายที่คุณ</text><text x="270" y="744" class="en">of it and said she was the wife</text></g><g id="sub4" display="none"><text x="270" y="685" class="th">กำลังจะแต่งงานด้วย...</text><text x="270" y="712" class="th">คุณจะทำยังไงคะ?</text><text x="270" y="735" class="en">of the man you're marrying... what would you</text><text x="270" y="752" class="en">do?</text></g><g id="sub5" display="none"><text x="270" y="694" class="th">คุณคบกับแฟนมาสามปี</text><text x="270" y="720" class="th">เขาเป็นผู้ชายที่</text><text x="270" y="744" class="en">You'd been together three years. He</text></g><g id="sub6" display="none"><text x="270" y="694" class="th">สมบูรณ์แบบจนคุณไม่เคย</text><text x="270" y="720" class="th">คิดสงสัยอะไรในตัวเขาเลย</text><text x="270" y="744" class="en">was so perfect you never once doubted him.</text></g><g id="sub7" display="none"><text x="270" y="694" class="th">จนกระทั่งประตู</text><text x="270" y="720" class="th">ห้องจัดเลี้ยงเปิดออก</text><text x="270" y="744" class="en">Until the ballroom doors swung open.</text></g><g id="sub8" display="none"><text x="270" y="694" class="th">ผู้หญิงคนหนึ่งใน</text><text x="270" y="720" class="th">ชุดเดรสสีดำเดินเข้ามา</text><text x="270" y="744" class="en">A woman in a black dress walked</text></g><g id="sub9" display="none"><text x="270" y="685" class="th">เธอสวมแหวนแต่งงาน</text><text x="270" y="712" class="th">แบบเดียวกับคุณทุกประการ</text><text x="270" y="735" class="en">in, wearing a wedding ring exactly like</text><text x="270" y="752" class="en">yours.</text></g><g id="sub10" display="none"><text x="270" y="694" class="th">ขอโทษนะคะ แต่ผู้ชายที่</text><text x="270" y="720" class="th">คุณกำลังจะแต่งงานด้วย</text><text x="270" y="744" class="en">I'm sorry, but the man you're about to</text></g><g id="sub11" display="none"><text x="270" y="707" class="th">... เป็นสามีของฉันค่ะ</text><text x="270" y="730" class="en">marry... is my husband.</text></g><g id="sub12" display="none"><text x="270" y="694" class="th">ทุกคนครับ ใจเย็น ๆ นะ</text><text x="270" y="720" class="th">ครับ ผู้หญิงคนนี้เป็น</text><text x="270" y="744" class="en">Everyone, please, stay calm. This woman is my</text></g><g id="sub13" display="none"><text x="270" y="685" class="th">แฟนเก่าของผมเอง เธอมี</text><text x="270" y="712" class="th">ปัญหาทางจิต เจ้าหน้าที่</text><text x="270" y="735" class="en">ex. She has mental health problems. Security,</text><text x="270" y="752" class="en">take</text></g><g id="sub14" display="none"><text x="270" y="707" class="th">ครับ พาเธอออกไปที</text><text x="270" y="730" class="en">her out, please.</text></g><g id="sub15" display="none"><text x="270" y="694" class="th">ก่อนออกจากงาน เธอ</text><text x="270" y="720" class="th">หันมามองคุณแล้วพูด</text><text x="270" y="744" class="en">Before she left, she turned to you and</text></g><g id="sub16" display="none"><text x="270" y="707" class="th">เพียงประโยคเดียว</text><text x="270" y="730" class="en">said just one thing.</text></g><g id="sub17" display="none"><text x="270" y="685" class="th">คืนนี้อย่าให้เขาถอดแหวน</text><text x="270" y="712" class="th">ออกจากนิ้วคุณเด็ดขาด</text><text x="270" y="735" class="en">Tonight, don't let him take the ring off your</text><text x="270" y="752" class="en">finger. No matter what.</text></g></svg></div><script>

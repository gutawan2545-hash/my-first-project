<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@700&family=Inter:wght@600&display=swap"><style>html,body{margin:0;background:transparent}svg{display:block}.th{font-family:"IBM Plex Sans Thai";font-weight:700;font-size:20px;fill:#ffd84a;stroke:#1a1410;stroke-width:5px;paint-order:stroke;stroke-linejoin:round;text-anchor:middle}.en{font-family:Inter,sans-serif;font-weight:600;font-size:13px;fill:#ffffff;stroke:#14121a;stroke-width:3.4px;paint-order:stroke;stroke-linejoin:round;text-anchor:middle}</style><svg id="s01_0" viewBox="0 0 540 960" width="540" height="960" xmlns="http://www.w3.org/2000/svg"><text x="270" y="694" class="th">ถ้าวันนี้เป็นวัน</text><text x="270" y="720" class="th">แต่งงานของคุณ แต่</text><text x="270" y="744" class="en">If today were your wedding day, and</text></svg><svg id="s01_1" viewBox="0 0 540 960" width="540" height="960" xmlns="http://www.w3.org/2000/svg"><text x="270" y="694" class="th">ระหว่างที่คุณกำลังจะ</text><text x="270" y="720" class="th">สวมแหวนให้เจ้าบ่าว</text><text x="270" y="744" class="en">just as you were about to put</text></svg><svg id="s01_2" viewBox="0 0 540 960" width="540" height="960" xmlns="http://www.w3.org/2000/svg"><text x="270" y="694" class="th">มีผู้หญิงคนหนึ่งเดิน</text><text x="270" y="720" class="th">เข้ามาในงาน แล้วบอกว่า</text><text x="270" y="744" class="en">the ring on the groom, a woman walked</text></svg><svg id="s01_3" viewBox="0 0 540 960" width="540" height="960" xmlns="http://www.w3.org/2000/svg"><text x="270" y="694" class="th">เธอคือภรรยาของคนที่คุณ</text><text x="270" y="720" class="th">กำลังจะแต่งงานด้วย</text><text x="270" y="744" class="en">in and said she was his wife, what</text></svg><svg id="s01_4" viewBox="0 0 540 960" width="540" height="960" xmlns="http://www.w3.org/2000/svg"><text x="270" y="707" class="th">คุณจะทำยังไง?</text><text x="270" y="730" class="en">would you do?</text></svg><svg id="s02_0" viewBox="0 0 540 960" width="540" height="960" xmlns="http://www.w3.org/2000/svg"><text x="270" y="694" class="th">งานแต่งงานในโรงแรมหรู</text><text x="270" y="720" class="th">ดอกไม้สีขาวประดับตลอด</text><text x="270" y="744" class="en">A wedding at a luxury hotel. White</text></svg><svg id="s02_1" viewBox="0 0 540 960" width="540" height="960" xmlns="http://www.w3.org/2000/svg"><text x="270" y="685" class="th">ทางเดิน แชนเดอเลียร์</text><text x="270" y="712" class="th">ระยิบระยับ แขกทุกคน</text><text x="270" y="735" class="en">flowers along the aisle, a glittering</text><text x="270" y="752" class="en">chandelier,</text></svg><svg id="s02_2" viewBox="0 0 540 960" width="540" height="960" xmlns="http://www.w3.org/2000/svg"><text x="270" y="694" class="th">กำลังปรบมือให้กับ</text><text x="270" y="720" class="th">คู่บ่าวสาว</text><text x="270" y="744" class="en">every guest applauding the couple.</text></svg><svg id="s03_0" viewBox="0 0 540 960" width="540" height="960" xmlns="http://www.w3.org/2000/svg"><text x="270" y="694" class="th">คุณคบกับแฟนมาสามปี</text><text x="270" y="720" class="th">เขาเป็นผู้ชายที่</text><text x="270" y="744" class="en">You'd been together three years. He</text></svg><svg id="s03_1" viewBox="0 0 540 960" width="540" height="960" xmlns="http://www.w3.org/2000/svg"><text x="270" y="680" class="th">สมบูรณ์แบบจนคุณไม่เคย</text><text x="270" y="707" class="th">คิดสงสัยอะไรในตัวเขา</text><text x="270" y="734" class="th">เลย</text><text x="270" y="757" class="en">was so perfect you never once doubted him.</text></svg><svg id="s04_0" viewBox="0 0 540 960" width="540" height="960" xmlns="http://www.w3.org/2000/svg"><text x="270" y="694" class="th">จนกระทั่งประตูห้องจัด</text><text x="270" y="720" class="th">เลี้ยงเปิดออก</text><text x="270" y="744" class="en">Until the ballroom doors swung open.</text></svg><svg id="s05_0" viewBox="0 0 540 960" width="540" height="960" xmlns="http://www.w3.org/2000/svg"><text x="270" y="694" class="th">ผู้หญิงคนหนึ่งในชุดเด</text><text x="270" y="720" class="th">รสสีดำเดินเข้ามา</text><text x="270" y="744" class="en">A woman in a black dress walked</text></svg><svg id="s05_1" viewBox="0 0 540 960" width="540" height="960" xmlns="http://www.w3.org/2000/svg"><text x="270" y="694" class="th">เธอสวมแหวนแต่งงานแบบ</text><text x="270" y="720" class="th">เดียวกับคุณทุกประการ</text><text x="270" y="744" class="en">in, wearing a wedding ring exactly like yours.</text></svg><svg id="s06_0" viewBox="0 0 540 960" width="540" height="960" xmlns="http://www.w3.org/2000/svg"><text x="270" y="694" class="th">ขอโทษนะคะ แต่ผู้ชายที่</text><text x="270" y="720" class="th">คุณกำลังจะแต่งงานด้วย</text><text x="270" y="744" class="en">I'm sorry, but the man you're about to</text></svg><svg id="s06_1" viewBox="0 0 540 960" width="540" height="960" xmlns="http://www.w3.org/2000/svg"><text x="270" y="707" class="th">... เป็นสามีของฉันค่ะ</text><text x="270" y="730" class="en">marry... is my husband.</text></svg><svg id="s07_0" viewBox="0 0 540 960" width="540" height="960" xmlns="http://www.w3.org/2000/svg"><text x="270" y="694" class="th">เจ้าบ่าวรีบบอกทุกคนว่า</text><text x="270" y="720" class="th">ผู้หญิงคนนี้เป็นแฟน</text><text x="270" y="744" class="en">The groom told everyone she was an</text></svg><svg id="s07_1" viewBox="0 0 540 960" width="540" height="960" xmlns="http://www.w3.org/2000/svg"><text x="270" y="694" class="th">เก่าที่มีปัญหาทางจิต</text><text x="270" y="720" class="th">และให้</text><text x="270" y="744" class="en">ex with mental health problems,</text></svg><svg id="s07_2" viewBox="0 0 540 960" width="540" height="960" xmlns="http://www.w3.org/2000/svg"><text x="270" y="694" class="th">พนักงานรักษาความปลอดภัย</text><text x="270" y="720" class="th">พาตัวออกไป</text><text x="270" y="744" class="en">and had security take her away.</text></svg><svg id="s08_0" viewBox="0 0 540 960" width="540" height="960" xmlns="http://www.w3.org/2000/svg"><text x="270" y="694" class="th">ก่อนออกจากงาน เธอหันมา</text><text x="270" y="720" class="th">มองคุณแล้วพูดเพียง</text><text x="270" y="744" class="en">Before she left, she turned to you and said</text></svg><svg id="s08_1" viewBox="0 0 540 960" width="540" height="960" xmlns="http://www.w3.org/2000/svg"><text x="270" y="707" class="th">ประโยคเดียว</text><text x="270" y="730" class="en">just one thing.</text></svg><svg id="s09_0" viewBox="0 0 540 960" width="540" height="960" xmlns="http://www.w3.org/2000/svg"><text x="270" y="672" class="th">คืนนี้อย่าให้เขาถอด</text><text x="270" y="698" class="th">แหวนออกจากนิ้วคุณ</text><text x="270" y="726" class="th">เด็ดขาด</text><text x="270" y="748" class="en">Tonight, don't let him take the ring off your</text><text x="270" y="766" class="en">finger. No matter what.</text></svg><svg id="s10_0" viewBox="0 0 540 960" width="540" height="960" xmlns="http://www.w3.org/2000/svg"><text x="270" y="694" class="th">งานแต่งดำเนินต่อไป</text><text x="270" y="720" class="th">แต่คุณเริ่มสังเกตเห็น</text><text x="270" y="744" class="en">The wedding went on, but you started</text></svg><svg id="s10_1" viewBox="0 0 540 960" width="540" height="960" xmlns="http://www.w3.org/2000/svg"><text x="270" y="707" class="th">ความผิดปกติ</text><text x="270" y="730" class="en">noticing things.</text></svg><svg id="s11_0" viewBox="0 0 540 960" width="540" height="960" xmlns="http://www.w3.org/2000/svg"><text x="270" y="685" class="th">แขกฝั่งเจ้าบ่าวแทบไม่</text><text x="270" y="712" class="th">มีใครถ่ายรูปเลย</text><text x="270" y="735" class="en">Almost no one on the groom's side took a</text><text x="270" y="752" class="en">single photo.</text></svg><svg id="s12_0" viewBox="0 0 540 960" width="540" height="960" xmlns="http://www.w3.org/2000/svg"><text x="270" y="685" class="th">แม่ของเจ้าบ่าวเรียกคุณ</text><text x="270" y="712" class="th">ผิดชื่อถึงสองครั้ง</text><text x="270" y="735" class="en">His mother called you by the wrong name.</text><text x="270" y="752" class="en">Twice.</text></svg><svg id="s13_0" viewBox="0 0 540 960" width="540" height="960" xmlns="http://www.w3.org/2000/svg"><text x="270" y="685" class="th">ช่างภาพเผลอพูดว่า</text><text x="270" y="712" class="th">ปีนี้จัดงานสวยกว่า</text><text x="270" y="735" class="en">The photographer let slip: this year looks</text><text x="270" y="752" class="en">better</text></svg><svg id="s13_1" viewBox="0 0 540 960" width="540" height="960" xmlns="http://www.w3.org/2000/svg"><text x="270" y="707" class="th">ครั้งที่แล้ว</text><text x="270" y="730" class="en">than last time.</text></svg><svg id="s14_0" viewBox="0 0 540 960" width="540" height="960" xmlns="http://www.w3.org/2000/svg"><text x="270" y="694" class="th">พนักงานโรงแรมมองคุณ</text><text x="270" y="720" class="th">ด้วยสายตาสงสาร</text><text x="270" y="744" class="en">The hotel staff looked at you with pity.</text></svg><svg id="s15_0" viewBox="0 0 540 960" width="540" height="960" xmlns="http://www.w3.org/2000/svg"><text x="270" y="694" class="th">คุณแอบค้นโทรศัพท์ของ</text><text x="270" y="720" class="th">เจ้าบ่าวระหว่างที่เขา</text><text x="270" y="744" class="en">While he was seeing the guests off, you went</text></svg><svg id="s15_1" viewBox="0 0 540 960" width="540" height="960" xmlns="http://www.w3.org/2000/svg"><text x="270" y="707" class="th">ออกไปส่งแขก</text><text x="270" y="730" class="en">through his phone.</text></svg><svg id="s16_0" viewBox="0 0 540 960" width="540" height="960" xmlns="http://www.w3.org/2000/svg"><text x="270" y="694" class="th">คุณพบอัลบั้มภาพ</text><text x="270" y="720" class="th">งานแต่งงานย้อนหลังหลาย</text><text x="270" y="744" class="en">You found wedding albums going</text></svg><svg id="s16_1" viewBox="0 0 540 960" width="540" height="960" xmlns="http://www.w3.org/2000/svg"><text x="270" y="694" class="th">ปี ทุกงานจัดในโรงแรม</text><text x="270" y="720" class="th">เดียวกัน ใช้ดอกไม้แบบ</text><text x="270" y="744" class="en">back years. Same hotel, same</text></svg><svg id="s16_2" viewBox="0 0 540 960" width="540" height="960" xmlns="http://www.w3.org/2000/svg"><text x="270" y="694" class="th">เดียวกัน เจ้าบ่าวคน</text><text x="270" y="720" class="th">เดียวกัน แต่เจ้าสาวไม่</text><text x="270" y="744" class="en">flowers, same groom. Never the same</text></svg><svg id="s16_3" viewBox="0 0 540 960" width="540" height="960" xmlns="http://www.w3.org/2000/svg"><text x="270" y="707" class="th">เคยซ้ำหน้า</text><text x="270" y="730" class="en">bride.</text></svg><svg id="s17_0" viewBox="0 0 540 960" width="540" height="960" xmlns="http://www.w3.org/2000/svg"><text x="270" y="694" class="th">และผู้หญิงชุดดำที่เดิน</text><text x="270" y="720" class="th">เข้ามาในงาน คือเจ้าสาว</text><text x="270" y="744" class="en">And the woman in black was last</text></svg><svg id="s17_1" viewBox="0 0 540 960" width="540" height="960" xmlns="http://www.w3.org/2000/svg"><text x="270" y="707" class="th">ของปีที่แล้ว</text><text x="270" y="730" class="en">year's bride.</text></svg><svg id="s18_0" viewBox="0 0 540 960" width="540" height="960" xmlns="http://www.w3.org/2000/svg"><text x="270" y="694" class="th">คุณลองค้นชื่อเจ้าสาว</text><text x="270" y="720" class="th">แต่ละคนบนอินเทอร์เน็ต</text><text x="270" y="744" class="en">You searched each bride's name online.</text></svg><svg id="s19_0" viewBox="0 0 540 960" width="540" height="960" xmlns="http://www.w3.org/2000/svg"><text x="270" y="685" class="th">ทุกคนมีประกาศตามหาคน</text><text x="270" y="712" class="th">หาย หลังจากวันแต่งงาน</text><text x="270" y="735" class="en">Every one of them was reported missing, just</text><text x="270" y="752" class="en">one day</text></svg><svg id="s19_1" viewBox="0 0 540 960" width="540" height="960" xmlns="http://www.w3.org/2000/svg"><text x="270" y="707" class="th">เพียงหนึ่งวัน</text><text x="270" y="730" class="en">after the wedding.</text></svg><svg id="s20_0" viewBox="0 0 540 960" width="540" height="960" xmlns="http://www.w3.org/2000/svg"><text x="270" y="694" class="th">เมื่อคุณพยายามหนี</text><text x="270" y="720" class="th">ออกจากโรงแรม ลิฟต์กลับ</text><text x="270" y="744" class="en">When you tried to run, the elevator kept</text></svg><svg id="s20_1" viewBox="0 0 540 960" width="540" height="960" xmlns="http://www.w3.org/2000/svg"><text x="270" y="694" class="th">พาคุณมาที่ชั้นเดิม</text><text x="270" y="720" class="th">ซ้ำแล้วซ้ำเล่า</text><text x="270" y="744" class="en">bringing you back to the same floor.</text></svg><svg id="s21_0" viewBox="0 0 540 960" width="540" height="960" xmlns="http://www.w3.org/2000/svg"><text x="270" y="694" class="th">โทรศัพท์ดังขึ้น เป็น</text><text x="270" y="720" class="th">เบอร์ของผู้หญิงชุดดำ</text><text x="270" y="744" class="en">Your phone rang. It was the woman in black.</text></svg><svg id="s22_0" viewBox="0 0 540 960" width="540" height="960" xmlns="http://www.w3.org/2000/svg"><text x="270" y="694" class="th">มันไม่ใช่สามีของฉัน</text><text x="270" y="720" class="th">หรอกค่ะ... ฉันแค่เคย</text><text x="270" y="744" class="en">He isn't my husband... I was just</text></svg><svg id="s22_1" viewBox="0 0 540 960" width="540" height="960" xmlns="http://www.w3.org/2000/svg"><text x="270" y="707" class="th">เป็นเจ้าสาวเหมือนคุณ</text><text x="270" y="730" class="en">a bride, like you.</text></svg><svg id="s23_0" viewBox="0 0 540 960" width="540" height="960" xmlns="http://www.w3.org/2000/svg"><text x="270" y="694" class="th">แล้วถ้าคุณอยากรอด</text><text x="270" y="720" class="th">คุณต้องหาผู้หญิงคนต่อ</text><text x="270" y="744" class="en">And if you want to live, you have to find the</text></svg><svg id="s23_1" viewBox="0 0 540 960" width="540" height="960" xmlns="http://www.w3.org/2000/svg"><text x="270" y="707" class="th">ไปมาแต่งงานกับมันแทน</text><text x="270" y="730" class="en">next woman to marry him instead.</text></svg><svg id="s24_0" viewBox="0 0 540 960" width="540" height="960" xmlns="http://www.w3.org/2000/svg"><text x="270" y="694" class="th">เสียงเคาะประตูดังขึ้น</text><text x="270" y="720" class="th">สามครั้ง</text><text x="270" y="744" class="en">Three knocks at the door.</text></svg><svg id="s25_0" viewBox="0 0 540 960" width="540" height="960" xmlns="http://www.w3.org/2000/svg"><text x="270" y="694" class="th">ที่รัก เปิดประตูให้ผม</text><text x="270" y="720" class="th">หน่อย ถึงเวลาถอดแหวน</text><text x="270" y="744" class="en">Darling, open the door. It's time to take off</text></svg><svg id="s25_1" viewBox="0 0 540 960" width="540" height="960" xmlns="http://www.w3.org/2000/svg"><text x="270" y="707" class="th">แล้วครับ</text><text x="270" y="730" class="en">the ring.</text></svg>

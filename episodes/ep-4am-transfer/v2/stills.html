<title>Odd Hours ตอนโอนตีสี่ ร่างใหม่</title>

<div class="wrap"><h1>ถ้ามีคนโอนเงินผิดมาให้คุณทุกวัน<span>Odd Hours · ร่างใหม่ · 15 ช็อต · 59 วินาที + โลโก้ · เสียงชั่วคราว</span></h1>
<div class="grid"><figure><img src="stills/01.jpg" alt="ช็อต 1: ฮุก · 04:00" width="540" height="960" loading="lazy"><figcaption><span class="n">ช็อต 1 · 0.0–5.7 วิ</span><b>ฮุก · 04:00</b><q>เจมส์ (บรรยาย): ถ้ามีคนโอนเงินเข้าบัญชีคุณตอนตีสี่ทุกคืน คุณจะยังคิดว่าเขาโอนผิดไหมครับ?</q><small>มุมบนลงโต๊ะ มือถือขึ้น 04:00 กับแจ้งเตือนเงินเข้า</small></figcaption></figure>
<figure><img src="stills/02.jpg" alt="ช็อต 2: ถอดหูฟัง" width="540" height="960" loading="lazy"><figcaption><span class="n">ช็อต 2 · 5.7–11.3 วิ</span><b>ถอดหูฟัง</b><q>เจมส์: สามร้อยสามสิบสามบาททุกคืน ผมแจ้งธนาคารไปแล้ว แต่เงินก็ยังเข้า</q><small>ห้องนอนชั้นสอง จอมือถือบนโต๊ะสว่างขึ้น เจมส์ดึงหูฟังเกมออก · ตัดเข้าด้วยซูมเบลอ + เสียงวูบ</small></figcaption></figure>
<figure><img src="stills/03.jpg" alt="ช็อต 3: ตะวันเจอเบาะแส" width="540" height="960" loading="lazy"><figcaption><span class="n">ช็อต 3 · 11.3–19.5 วิ</span><b>ตะวันเจอเบาะแส</b><q>เจมส์: แฟนผมเลื่อนดูยอดย้อนหลัง แล้วก็หยุดนิ่ง / ตะวัน: เจม ดูตรงสตางค์สิ… อ่านตัวสุดท้ายให้ฟังหน่อย เริ่มจากคืนแรกนะ</q><small>นิ้วตะวันเลื่อนรายการย้อนหลัง หยุดที่คืนที่ 1–2 วงเลขหลักสุดท้ายไว้</small></figcaption></figure>
<figure><img src="stills/04.jpg" alt="ช็อต 4: เจมอ่านเลข" width="540" height="960" loading="lazy"><figcaption><span class="n">ช็อต 4 · 19.5–21.9 วิ</span><b>เจมอ่านเลข</b><q>เจมส์: ศูนย์… แปด…</q><small>เจมส์ถือมือถืออ่านทีละตัว ตะวันจดลงกระดาษ</small></figcaption></figure>
<figure><img src="stills/05.jpg" alt="ช็อต 5: จดครบสิบหลัก" width="540" height="960" loading="lazy"><figcaption><span class="n">ช็อต 5 · 21.9–25.1 วิ</span><b>จดครบสิบหลัก</b><q>(ไม่มีบทพูด · เสียงปากกา)</q><small>กระดาษใกล้ ๆ ตัวเลขขึ้นทีละตัว มือตะวันวางทับสี่ตัวท้าย</small></figcaption></figure>
<figure><img src="stills/06.jpg" alt="ช็อต 6: ตะวันนึกออก" width="540" height="960" loading="lazy"><figcaption><span class="n">ช็อต 6 · 25.1–28.7 วิ</span><b>ตะวันนึกออก</b><q>ตะวัน: เดี๋ยวนะ… นี่มันเบอร์มือถือ</q><small>ตะวันชูกระดาษ หน้าตกใจ · กล้องสั่น + เสียงทุ้มกระแทก</small></figcaption></figure>
<figure><img src="stills/07.jpg" alt="ช็อต 7: กดเบอร์" width="540" height="960" loading="lazy"><figcaption><span class="n">ช็อต 7 · 28.7–31.4 วิ</span><b>กดเบอร์</b><q>(เสียงกดปุ่มทีละตัว)</q><small>ใหม่ · หน้าจอปุ่มกดโทรศัพท์ ตัวเลขขึ้นทีละหลักตามนิ้วโป้งที่กด แล้วกดปุ่มโทรสีเขียว</small></figcaption></figure>
<figure><img src="stills/08.jpg" alt="ช็อต 8: โทรครั้งแรก" width="540" height="960" loading="lazy"><figcaption><span class="n">ช็อต 8 · 31.4–33.0 วิ</span><b>โทรครั้งแรก</b><q>(ไม่มีบทพูด)</q><small>ทั้งคู่ในห้องนอน ตะวันยกมือถือแนบหู เจมส์หน้าตื่น</small></figcaption></figure>
<figure><img src="stills/09.jpg" alt="ช็อต 9: ดีนได้ยินก่อน" width="540" height="960" loading="lazy"><figcaption><span class="n">ช็อต 9 · 33.0–34.9 วิ</span><b>ดีนได้ยินก่อน</b><q>(เสียงกริ่งอู้อี้จากนอกห้อง)</q><small>ดีนนอนข้างประตูห้องเก็บของ ยกหัวมองประตูทันทีที่กริ่งดัง · ตัดเข้าด้วยซูมเบลอ</small></figcaption></figure>
<figure><img src="stills/10.jpg" alt="ช็อต 10: ตะวันหุบยิ้ม" width="540" height="960" loading="lazy"><figcaption><span class="n">ช็อต 10 · 34.9–36.5 วิ</span><b>ตะวันหุบยิ้ม</b><q>(กดวาง · เสียงกริ่งหยุดพร้อมกัน)</q><small>ตะวันหุบยิ้ม เงยหน้าจากมือถือมาสบตาเจม ค้างครึ่งวินาที · ปากชมพูตุ่น</small></figcaption></figure>
<figure><img src="stills/11.jpg" alt="ช็อต 11: ลองอีกที" width="540" height="960" loading="lazy"><figcaption><span class="n">ช็อต 11 · 36.5–38.6 วิ</span><b>ลองอีกที</b><q>เจมส์ (กระซิบ): ลองโทรอีกทีดิ</q><small>เจมส์ครึ่งตัว หน้ากังวล · ปากไม่แดงแล้ว ผิวโทนเดียวกับช่วงแรก</small></figcaption></figure>
<figure><img src="stills/12.jpg" alt="ช็อต 12: เสียงหลังประตู" width="540" height="960" loading="lazy"><figcaption><span class="n">ช็อต 12 · 38.6–40.6 วิ</span><b>เสียงหลังประตู</b><q>(เสียงกริ่งดังชัด · ดนตรีลดลง)</q><small>ประตูบานเดิม 85:200 หน้าตรง เห็นวงกบครบ แสงลอดใต้ประตู · ซูมเบลอ + กล้องสั่น</small></figcaption></figure>
<figure><img src="stills/13.jpg" alt="ช็อต 13: ข้ามไหล่เจม" width="540" height="960" loading="lazy"><figcaption><span class="n">ช็อต 13 · 40.6–44.2 วิ</span><b>ข้ามไหล่เจม</b><q>(เสียงกริ่งต่อเนื่อง)</q><small>มองข้ามไหล่เจมไปที่ประตูปลายทางเดิน เจมหันตามเสียงแล้วก้าวหนึ่งก้าว ตะวันถือมือถืออยู่ข้าง ๆ</small></figcaption></figure>
<figure><img src="stills/14.jpg" alt="ช็อต 14: เพลงเรียกเข้าเครื่องเก่า" width="540" height="960" loading="lazy"><figcaption><span class="n">ช็อต 14 · 44.2–50.7 วิ</span><b>เพลงเรียกเข้าเครื่องเก่า</b><q>เจมส์: และเสียงเรียกเข้านั้น เป็นเพลงเดียวกับมือถือเครื่องเก่าของผม ที่หายไปตั้งแต่ปีก่อน</q><small>เจมส์ครึ่งตัวหน้าตกใจ (ไม่ใส่หูฟังแล้ว) โน้ตเพลงลอยออกจากขอบประตู การ์ด "เพลงเรียกเข้าเครื่องเก่า"</small></figcaption></figure>
<figure><img src="stills/15.jpg" alt="ช็อต 15: การ์ดเลือก A/B" width="540" height="960" loading="lazy"><figcaption><span class="n">ช็อต 15 · 50.7–59.2 วิ</span><b>การ์ดเลือก A/B</b><q>เจมส์: ถ้าเป็นคุณ จะเปิดประตูไปดูว่าใครอยู่ข้างใน หรือพาแฟนกับแมวออกจากบ้านก่อน คอมเมนต์บอกผมหน่อยครับ</q><small>การ์ดตัวเลือก A เปิดประตู / B พาแฟนกับแมวออกจากบ้าน มือเจมเอื้อมหาลูกบิด ดีนนั่งมองจากมุมล่าง · ต่อด้วยฉากโลโก้ odd hours</small></figcaption></figure>
</div></div>

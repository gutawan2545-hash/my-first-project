<style>
/* Layout: responsive grid of full-body cards (5 / 3 / 2 columns) plus one wide card for the children. Single dark look by choice, matching the other character sheets. */
:root { --stage:#0d0f14; --ink:#d4d6e0; --muted:#80849a; --line:#2a2e3a;
  --font:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif; color-scheme:dark; }
html,body { background:var(--stage); color:var(--ink); margin:0; }
body { font-family:var(--font); padding:24px max(16px, env(safe-area-inset-right,0px)) 40px max(16px, env(safe-area-inset-left,0px)); }
.wrap { max-width:1100px; margin:0 auto; display:grid; gap:18px; }
h1 { font-size:18px; font-weight:500; margin:0; } h1 span { color:var(--muted); font-weight:400; margin-left:8px; font-size:14px; }
p.note { margin:0; font-size:13px; color:var(--muted); line-height:1.6; }
.grid { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:16px; }
@media (max-width:900px) { .grid { grid-template-columns:repeat(3,minmax(0,1fr)); } }
@media (max-width:520px) { .grid { grid-template-columns:repeat(2,minmax(0,1fr)); } }
figure { margin:0; min-width:0; display:grid; gap:8px; align-content:start; }
figure.wide { grid-column:1 / -1; }
figure svg { display:block; width:100%; height:auto; border-radius:6px; box-shadow:0 0 0 1px var(--line); }
figcaption { font-size:12.5px; color:var(--muted); line-height:1.6; } figcaption b { color:var(--ink); font-weight:500; }
.sub { font-size:12px; }
</style>

  <h1>แม่ชีคนที่สอง · ตัวละครเต็มตัว<span>หน้าตรง แสงจากซ้าย · แยกชิ้นขา แขน ตัว หัว ไว้ทำแอนิเมชัน</span></h1>
  <p class="note">ทุกตัวแยกเป็นชิ้น: ขาซ้าย ขาขวา (หมุนที่สะโพก) · ตัว · แขนซ้าย แขนขวา (หมุนที่หัวไหล่) · หัว (หมุนที่คอ) ชิ้นละกลุ่ม พร้อมจุดหมุนในไฟล์ เพื่อให้เดิน โบกมือ หันหน้าได้ตอนทำคลิป</p>
  <div class="grid">
<figure><svg viewBox="-80 -70 160 450" role="img" aria-label="เมฆ"><rect x="-80" y="-70" width="160" height="450" fill="#1b1f2b"/><ellipse cx="0" cy="374" rx="52" ry="7" fill="#10131b"/><use href="#fb-mek"/></svg><figcaption><b>เมฆ</b> <span class="sub">31 · ผู้เล่าเรื่อง</span><br>แจ็กเก็ตยีนส์ซีด เสื้อยืดขาว กางเกงยีนส์เข้ม รองเท้าผ้าใบขาว กล้องฟิล์มสะพายข้าง</figcaption></figure><figure><svg viewBox="-80 -70 160 450" role="img" aria-label="ซิสเตอร์มาเรียม"><rect x="-80" y="-70" width="160" height="450" fill="#1b1f2b"/><ellipse cx="0" cy="374" rx="52" ry="7" fill="#10131b"/><use href="#fb-mariam"/></svg><figcaption><b>ซิสเตอร์มาเรียม</b> <span class="sub">29 · แฝดที่รอด</span><br>ชุดซิสเตอร์ยาวถึงข้อเท้า รองเท้าหนังดำ แผลไฟไหม้ที่หลังมือซ้าย</figcaption></figure><figure><svg viewBox="-80 -70 160 450" role="img" aria-label="ซิสเตอร์อักเนส"><rect x="-80" y="-70" width="160" height="450" fill="#1b1f2b"/><ellipse cx="0" cy="374" rx="52" ry="7" fill="#10131b"/><use href="#fb-agnes"/></svg><figcaption><b>ซิสเตอร์อักเนส</b> <span class="sub">29 · ห้องพยาบาล (มาร์ธา)</span><br>ผิวซีดจนเกือบเทา ยิ้มหลอน มือก็ซีด เป็นคนจริง ไม่ใช่วิญญาณ</figcaption></figure><figure><svg viewBox="-80 -70 160 450" role="img" aria-label="ป้าแดง"><rect x="-80" y="-70" width="160" height="450" fill="#1b1f2b"/><ellipse cx="0" cy="374" rx="52" ry="7" fill="#10131b"/><use href="#fb-daeng"/></svg><figcaption><b>ป้าแดง</b> <span class="sub">67 · แม่ครัว</span><br>เสื้อลายดอกแขนสั้น ผ้าถุงสีม่วงเข้ม ผ้ากันเปื้อนยาวถึงเข่า รองเท้าแตะ พวงกุญแจที่เอว</figcaption></figure><figure><svg viewBox="-80 -70 160 450" role="img" aria-label="มาเธอร์คาทารีนา"><rect x="-80" y="-70" width="160" height="450" fill="#1b1f2b"/><ellipse cx="0" cy="374" rx="52" ry="7" fill="#10131b"/><use href="#fb-cat"/></svg><figcaption><b>มาเธอร์คาทารีนา</b> <span class="sub">55 · อธิการิณี</span><br>ชุดซิสเตอร์เต็มยศ กางเขนทองเหลือง</figcaption></figure><figure><svg viewBox="-80 -70 160 450" role="img" aria-label="ซิสเตอร์โรซา"><rect x="-80" y="-70" width="160" height="450" fill="#1b1f2b"/><ellipse cx="0" cy="374" rx="52" ry="7" fill="#10131b"/><use href="#fb-rosa"/></svg><figcaption><b>ซิสเตอร์โรซา</b> <span class="sub">22 · ซิสเตอร์ฝึกหัด</span><br>ผ้าคลุมศีรษะสีขาว</figcaption></figure><figure><svg viewBox="-80 -70 160 450" role="img" aria-label="คุณพ่อยอแซฟ"><rect x="-80" y="-70" width="160" height="450" fill="#1b1f2b"/><ellipse cx="0" cy="374" rx="52" ry="7" fill="#10131b"/><use href="#fb-jos"/></svg><figcaption><b>คุณพ่อยอแซฟ</b> <span class="sub">45 · บาทหลวง</span><br>ชุดบาทหลวงขาวยาวถึงข้อเท้า คาดเอวดำ รองเท้าดำ</figcaption></figure><figure><svg viewBox="-80 -70 160 450" role="img" aria-label="ร.ต.อ.ธนา"><rect x="-80" y="-70" width="160" height="450" fill="#1b1f2b"/><ellipse cx="0" cy="374" rx="52" ry="7" fill="#10131b"/><use href="#fb-thana"/></svg><figcaption><b>ร.ต.อ.ธนา</b> <span class="sub">40 · ตำรวจ</span><br>เสื้อกากีเหน็บในกางเกง เข็มขัดดำ กางเกงกากีเข้ม รองเท้าบูตดำ</figcaption></figure><figure><svg viewBox="-80 -70 160 450" role="img" aria-label="มาเธอร์ลูเซีย"><rect x="-80" y="-70" width="160" height="450" fill="#1b1f2b"/><ellipse cx="0" cy="374" rx="52" ry="7" fill="#10131b"/><use href="#fb-luc"/></svg><figcaption><b>มาเธอร์ลูเซีย</b> <span class="sub">76 · นั่งรถเข็น</span><br>นั่งรถเข็นตลอด มือวางบนตัก กำลูกประคำ เท้าวางบนที่พักเท้า</figcaption></figure>

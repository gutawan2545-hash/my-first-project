<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one 9:16 frame centered on a dark stage, a single guide toggle under it. Single dark look by choice. */
:root {
  --stage: #0d0f14;
  --ink: #c9cbd6;
  --muted: #7d8191;
  --line: #2a2e3a;
  --font: "IBM Plex Sans Thai", "Noto Sans Thai", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { background: var(--stage); color: var(--ink); }
body {
  font-family: var(--font);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 28px;
  display: flex; flex-direction: column; align-items: center; gap: 14px;
}
.frame {
  width: min(100%, 460px, calc((100vh - 110px) * 0.5625));
  min-width: 260px;
  max-width: 100%;
  aspect-ratio: 9 / 16;
  position: relative;
  box-shadow: 0 0 0 1px var(--line), 0 20px 50px rgba(0,0,0,.5);
}
.frame svg { display: block; width: 100%; height: 100%; }
#guide { display: none; }
.frame.show-guide #guide { display: inline; }
.bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center; font-size: 13px; color: var(--muted); }
button {
  font: inherit; font-size: 13px; color: var(--ink); background: transparent;
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer;
}
button:hover { border-color: var(--muted); }
button:focus-visible { outline: 2px solid #8f86ff; outline-offset: 2px; }
button[aria-pressed="true"] { border-color: #8f86ff; color: #fff; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500&display=swap">
